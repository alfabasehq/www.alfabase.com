<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="272.64" height="309.68" viewBox="63.68 64.56 272.64 309.68" fill="none" role="img" aria-label="AB isometric cube monogram">
  

  <!-- Top face: pixel grid (yellow) -->
  <g transform="matrix(1.42,0.82,-1.42,0.82,200,58)" fill="#FFD23F">
    <rect x="4" y="4" width="17" height="17"/>
    <rect x="29" y="4" width="17" height="17"/>
    <rect x="54" y="4" width="17" height="17"/>
    <rect x="79" y="4" width="17" height="17"/>
    <rect x="4" y="29" width="17" height="17"/>
    <rect x="29" y="29" width="17" height="17" fill-opacity="0.4"/>
    <rect x="54" y="29" width="17" height="17"/>
    <rect x="79" y="29" width="17" height="17"/>
    <rect x="4" y="54" width="17" height="17"/>
    <rect x="29" y="54" width="17" height="17"/>
    <rect x="54" y="54" width="17" height="17"/>
    <rect x="79" y="54" width="17" height="17" fill-opacity="0.4"/>
    <rect x="4" y="79" width="17" height="17"/>
    <rect x="29" y="79" width="17" height="17"/>
    <rect x="54" y="79" width="17" height="17"/>
    <rect x="79" y="79" width="17" height="17"/>
  </g>

  <!-- Front-left face: "A" (pink) -->
  <g transform="matrix(1.42,0.82,0,1.62,58,140)" fill="#EE4266">
    <rect x="4" y="4" width="92" height="18"/>
    <rect x="4" y="4" width="18" height="92"/>
    <rect x="78" y="4" width="18" height="92"/>
    <rect x="4" y="41" width="92" height="18"/>
  </g>

  <!-- Front-right face: "B" (mint) -->
  <g transform="matrix(1.42,-0.82,0,1.62,200,222)" fill="#2EC4B6">
    <rect x="4" y="4" width="18" height="92"/>
    <rect x="4" y="4" width="92" height="18"/>
    <rect x="4" y="41" width="92" height="18"/>
    <rect x="4" y="78" width="92" height="18"/>
    <rect x="78" y="4" width="18" height="55"/>
    <rect x="78" y="41" width="18" height="55"/>
  </g>
